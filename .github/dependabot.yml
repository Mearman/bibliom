version: 2
updates:
  # All npm manifests in one update set: shared versions across the workspace
  # (syncpack enforces alignment) must move together, and dependabot only
  # groups within a single update set -- per-directory sets produced
  # single-manifest bumps that failed the syncpack gate on every PR.
  - package-ecosystem: npm
    directories:
      - "/"
      - "/apps/*"
      - "/packages/*"
    schedule:
      interval: daily
      time: "00:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 15
    reviewers:
      - "Mearman"
    commit-message:
      prefix: "chore"
      include: "scope"
    rebase-strategy: auto
    groups:
      react:
        patterns:
          - "react*"
          - "@types/react*"
      tanstack:
        patterns:
          - "@tanstack/*"
      testing:
        patterns:
          - "vitest*"
          - "@vitest/*"
          - "jsdom"
          - "@types/jsdom"
          - "@testing-library/*"
          - "@playwright/*"
      build-tools:
        patterns:
          - "vite*"
          - "@vitejs/*"
          - "typescript*"
          - "eslint*"
          - "@eslint/*"
          - "@typescript-eslint/*"
          - "@stylistic/*"
      mantine:
        patterns:
          - "@mantine/*"
      semantic-release:
        patterns:
          - "semantic-release"
          - "@semantic-release/*"
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
      commitlint:
        patterns:
          - "@commitlint/*"
      swc:
        patterns:
          - "@swc/*"
          - "@swc-node/*"
      vanilla-extract:
        patterns:
          - "@vanilla-extract/*"

  # GitHub Actions updates
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "00:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    reviewers:
      - "Mearman"
    commit-message:
      prefix: "ci"
      include: "scope"
    rebase-strategy: auto
